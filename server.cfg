// Use this file to configure your DEDICATED server. 
// This config file is executed on server start.

// Game server hostname
hostname "Zombie Nightmare"

// Rcon server password
rcon_password ""

// Brut protection rcon password
sv_rcon_banpenalty "60"
sv_rcon_maxfailures "5"
sv_rcon_minfailures "5"
sv_rcon_minfailuretime "30"

mp_friendlyfire "0"
mp_hostagepenalty "0"
mp_tkpunish "0"
mp_timelimit "30"
mp_freezetime "0"
mp_roundtime "5"
mp_forcecamera "0"
mp_forcechasecam "0"
mp_fadetoblack "0"
sv_airaccelerate "10"
sv_cheats "0"
sv_gravity "800"
sv_maxspeed "320"
allow_spectators "1"
pausable "0"
sv_proxies "1"
sv_voiceenable "1"
sv_voicequality "5"
sv_alltalk "1"
sv_spectatormaxspeed "500"
sv_aim "0"
sv_timeout "40"
sv_contact ""

// Server regions
sv_region "3"

// Server-level lag compensation 
sv_unlag "1"
sv_unlagsamples "1"
sv_unlagpush "0"
sv_maxunlag "0.5"

// Server logging
log "off"
sv_logbans "1"
sv_log_onefile "0"
mp_logdetail "3"
mp_logmessages "1"

// Server rates
sv_maxrate "100000"
sv_minrate "25000"
sv_maxupdaterate "102"
sv_minupdaterate "30"

// load ban files
exec listip.cfg
exec banned.cfg

// Server ticrate
sys_ticrate "1100"

mapchangecfgfile "server.cfg"

//FastDL
//sv_downloadurl "http://youwebsite.com/server_file_folder/"
//sv_allowdownload "1"
//sv_allowupload "0"

// custom.hpk disabled
hpk_maxsize "0"
sv_send_logos "0"

// Built-in ReHLDS protection
sv_rehlds_stringcmdrate_max_burst "500"
sv_rehlds_stringcmdrate_max_avg "250"
sv_rehlds_movecmdrate_max_burst "5500"
sv_rehlds_movecmdrate_max_avg "1800"
sv_rehlds_movecmdrate_avg_punish "5"
sv_rehlds_movecmdrate_burst_punish "5"
sv_rehlds_stringcmdrate_avg_punish "5"
sv_rehlds_stringcmdrate_burst_punish "5"
sv_rehlds_force_dlmax "1"